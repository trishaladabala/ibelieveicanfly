<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560">
<style>
  .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #111; }
  .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #555; }
  .col-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #1e3a8a; }
  .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #222; }
  .metric { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #333; }
  .highlight { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #b91c1c; }
  .caption { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />
<!-- Header -->
<text x="40" y="38" class="title">Figure 2: Decoupling Overall Reciprocity from Chemical Transmitter Selectivity</text>
<text x="40" y="58" class="subtitle">Why Degree-Preserving Edge Swaps artificially inflate GABA-GABA Z-scores from +15 to +125 in the Ellipsoid Body (w ≥ 5)</text>
<!-- Left Panel -->
<rect x="40" y="85" width="425" height="410" fill="#f8fafc" stroke="#cbd5e1" rx="8" />
<text x="60" y="115" class="col-title">Tier 1: Topological MCMC Edge-Swap Null</text>
<text x="60" y="135" class="caption">Preserves in/out-degrees; randomizes directed connections.</text>
<rect x="60" y="155" width="385" height="100" fill="#ffffff" stroke="#e2e8f0" rx="6" />
<text x="75" y="180" class="box-title">Effect on Reciprocal Dyad Count (M)</text>
<text x="75" y="205" class="metric">• Empirical Mutual Dyads: <tspan font-weight="bold">3,518</tspan> (R_edge = 44.5%)</text>
<text x="75" y="225" class="metric">• Edge-Swap Null M: <tspan font-weight="bold">763.4 ± 22.0</tspan> (R_edge ≈ 9.7%)</text>
<text x="75" y="245" class="highlight">Result: 4.61× collapse of reciprocal topology</text>
<rect x="60" y="270" width="385" height="185" fill="#ffffff" stroke="#e2e8f0" rx="6" />
<text x="75" y="295" class="box-title">Confounded EB GABA ↔ GABA Metric</text>
<text x="75" y="320" class="metric">• Observed GABA ↔ GABA: <tspan font-weight="bold">2,615</tspan></text>
<text x="75" y="340" class="metric">• Edge-Swap Null Mean: <tspan font-weight="bold">385.9 ± 17.7</tspan></text>
<text x="75" y="365" class="metric">• Apparent Raw Enrichment: <tspan font-weight="bold" fill="#b91c1c">6.78×</tspan></text>
<text x="75" y="390" class="metric">• Apparent Z-Score: <tspan font-weight="bold" fill="#b91c1c">Z = +125.7</tspan></text>
<text x="75" y="425" class="caption">⚠️ Conflates 4.6× excess loops with chemical preference.</text>
<text x="75" y="440" class="caption">    In rewired graph, GABA-GABA is already 50.5% of M.</text>
<!-- Right Panel -->
<rect x="515" y="85" width="425" height="410" fill="#f0fdf4" stroke="#bbf7d0" rx="8" />
<text x="535" y="115" class="col-title" fill="#15803d">Tier 2: Conditional Degree-Stratified Null</text>
<text x="535" y="135" class="caption">Holds empirical mutual dyads constant; permutes labels by degree.</text>
<rect x="535" y="155" width="385" height="100" fill="#ffffff" stroke="#dcfce7" rx="6" />
<text x="550" y="180" class="box-title">Preservation of Empirical Topology</text>
<text x="550" y="205" class="metric">• Empirical Mutual Dyads: <tspan font-weight="bold">3,518</tspan> (Fixed)</text>
<text x="550" y="225" class="metric">• Conditional Null M: <tspan font-weight="bold">3,518</tspan> (Exact Match, 100%)</text>
<text x="550" y="245" class="stat-text" fill="#15803d">✓ Zero topology confounding: tests chemical pairing alone</text>
<rect x="535" y="270" width="385" height="185" fill="#ffffff" stroke="#dcfce7" rx="6" />
<text x="550" y="295" class="box-title">Isolated EB GABA ↔ GABA Pairing</text>
<text x="550" y="320" class="metric">• Observed GABA ↔ GABA: <tspan font-weight="bold">2,615</tspan> (74.33% of M)</text>
<text x="550" y="340" class="metric">• Stratified Null Mean: <tspan font-weight="bold">2,167.1 ± 29.3</tspan> (61.60% of M)</text>
<text x="550" y="365" class="metric">• True Conditional Enrichment: <tspan font-weight="bold" fill="#15803d">1.21× (+20.7%)</tspan></text>
<text x="550" y="390" class="metric">• Calibrated Z-Score: <tspan font-weight="bold" fill="#15803d">Z = +15.3 (p = 0.0005)</tspan></text>
<text x="550" y="425" class="caption">✓ Connection-level probabilistic mass: 2,336.6 (66.4% of M)</text>
<text x="550" y="440" class="caption">✓ Substantial, robust, but biologically moderated effect.</text>
<text x="40" y="540" class="subtitle">Equation: Raw Ratio (6.78×) ≈ Topological Reciprocity Excess (4.61×) × Conditional Pairing Preference (1.47× naive / 1.21× stratified).</text>
</svg>